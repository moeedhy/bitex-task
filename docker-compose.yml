services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pooleno
      POSTGRES_PASSWORD: pooleno
      POSTGRES_DB: pooleno
    ports:
      - '${POSTGRES_PORT:-55433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./apps/api/src/infrastructure/database/000_create_test_database.sql:/docker-entrypoint-initdb.d/000_create_test_database.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pooleno -d pooleno']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - '${REDIS_PORT:-63791}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9193}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - '${KAFKA_PORT:-9193}:29092'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list',
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  application:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://pooleno:pooleno@postgres:5432/pooleno
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: withdrawal-execution-requested
      ENABLE_MESSAGING: 'true'
      SEED_DEV_DATA: 'true'
      FAKE_PROVIDER_OUTCOME: SUCCESS
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
